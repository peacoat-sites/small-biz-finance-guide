baseURL = "https://smallbizfinanceguide.com/"
enableGitInfo = true
languageCode = "en-us"
title = "Small Biz Finance Guide"




enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 12

[params]
  page_bg = "#f0fdf4"
  nav_style = "dark"
logo_text_2 = "Finance Guide"
logo_text_1 = "SmallBiz"
author = "Stephen Brenish"
  description = "Clear guides to small business loans, bookkeeping, taxes, and financial planning for entrepreneurs and small business owners."
  niche = "Small Business Finance"
  adsense_id = "ca-pub-3466203197759215"
  adsense_slot_header = "auto"
  adsense_slot_incontent = "auto"
  adsense_slot_sidebar = "auto"
  image_query = "small business finance entrepreneur accounting office"
  logo_text = "Small Biz Finance Guide"
  tagline = "Small business finance made simple,  funding, taxes, and growth strategies"
  cloudflare_analytics = ""

  # Authority theme
  monthly_readers = 47000
  research_hours  = 520
  satisfaction    = 97
  trust_extra     = "Finance professionals consulted"
  impact_verification = ""
  impact_tracking_id  = ""

  persona_name       = "James Okafor"
  persona_title      = "Small Business Finance Editor"
  persona_bio        = "Entrepreneur and small business finance writer who has founded and operated small businesses across two industries."
  persona_initials   = "JO"
  disclaimer         = "This content is for informational purposes only and does not constitute financial or legal advice. Consult a qualified professional before making business or financial decisions."
primary_color = "#14532d"
hero_color_1 = "#0b0900"
hero_color_2 = "#1a1300"
hero_color_3 = "#e8b84b"
hero_color_4 = "#070600"

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "daily"
  priority = 0.5
  filename = "sitemap.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[permalinks]
  posts = "/:slug/"

[related]
  includeNewer = true
  threshold    = 80
  toLower      = false
  [[related.indices]]
    name   = "keywords"
    weight = 100
  [[related.indices]]
    name   = "tags"
    weight = 80
  [[related.indices]]
    name   = "categories"
    weight = 50

[services]
  [services.googleAnalytics]
    id = "G-5GT7DCBXDK"
